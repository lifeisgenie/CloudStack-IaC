# 실제 비밀번호는 저장소에 커밋하지 않습니다.
# 배포 전에 아래 명령으로 Secret을 만들거나, <GITLAB_ROOT_PASSWORD>를 바꿔 적용하세요.
#   kubectl create secret generic gitlab-secret \
#     --from-literal=ROOT_PASSWORD='<GITLAB_ROOT_PASSWORD>' -n default
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-secret
  namespace: default
type: Opaque
stringData:
  ROOT_PASSWORD: "<GITLAB_ROOT_PASSWORD>"
